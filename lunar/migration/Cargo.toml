[package]
name = "migration"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
async-std = { version = "1", features = ["attributes", "tokio1"] }
hex = "0.4.3"
uuid = { version = "1.21.0", features = ["v4"] }

[dependencies.sea-orm-migration]
version = "~2.0.0-rc.37"
features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",

]
